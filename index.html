<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ax___najmul___07 | Creator</title>
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Follow ax___najmul___07 for reels, videos and stories.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --card: #181818;
      --text: #ffffff;
      --muted: #aaaaaa;
      --pink: #ff0055;
      --orange: #ff7a00;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 45px 20px 25px;
    }

    .profile {
      display: block;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      border: 4px solid white;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 28px rgba(255, 100, 0, 0.45);
    }

    h1 {
      margin-top: 22px;
      font-size: 30px;
      overflow-wrap: anywhere;
    }

    .username {
      margin-top: 7px;
      color: var(--muted);
      font-size: 18px;
    }

    .bio {
      margin: 24px auto 28px;
      color: #dddddd;
      font-size: 17px;
      line-height: 2;
    }

    .buttons {
      display: grid;
      gap: 16px;
      margin: 28px auto 0;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 12px;
      border-radius: 40px;
      background: linear-gradient(100deg, var(--pink), var(--orange));
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 7px 24px rgba(255, 70, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .section-title {
      margin: 48px 0 22px;
      font-size: 27px;
    }

    .posts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .post {
      min-width: 0;
      min-height: 210px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #303030;
      border-radius: 22px;
      background: linear-gradient(145deg, #202020, #111111);
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
      transition: border-color 0.2s, transform 0.2s;
    }

    .post:hover {
      border-color: var(--orange);
      transform: translateY(-3px);
    }

    .post-icon {
      font-size: 44px;
      line-height: 1.3;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 35px 14px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .post {
        min-height: 160px;
        font-size: 14px;
      }

      .post-icon {
        font-size: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <img
        class="profile"
        src="20260904_153946.png"
        alt="ax___najmul___07 profile photo"
      >

      <h1>ax___najmul___07</h1>

      <p class="username">@ax___najmul___07</p>

      <p class="bio">
        🔥 Creator · Reels · Attitude<br>
        🎬 New Videos &amp; Stories<br>
        ❤️ Follow for more
      </p>
    </header>

    <nav class="buttons" aria-label="Social links">
      <a
        class="btn"
        href="https://www.instagram.com/ax___najmul___07/"
        target="_blank"
        rel="noopener noreferrer"
      >
        📸 Follow Me on Instagram
      </a>

      <a class="btn" href="#reels">
        🎬 Watch My Reels
      </a>
    </nav>

    <section id="reels" aria-labelledby="posts-heading">
      <h2 class="section-title" id="posts-heading">
        🔥 My Posts
      </h2>

      <div class="posts">
        <a
          class="post"
          href="https://www.instagram.com/reel/DdyunN0SRJl/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Watch Instagram Reel"
        >
          <span class="post-icon" aria-hidden="true">▶️</span>
          <span>Watch Reel</span>
        </a>

        <a
          class="post"
          href="https://www.instagram.com/ax___najmul___07/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View Instagram photos"
        >
          <span class="post-icon" aria-hidden="true">📸</span>
          <span>Instagram Photos</span>
        </a>
      </div>
    </section>

    <footer>
      © 2026 ax___najmul___07 · All rights reserved
    </footer>

  </main>
</body>
</html>
